name: Probe external Dua and Ziyarat source structure
on:
  push:
    branches: [import/ziyarat-nahiya-alqama]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install temporary HTML parser
        run: npm install --no-save cheerio@1.1.2
      - name: Inspect source page structure
        run: node scripts/probe-reading-sources.mjs
