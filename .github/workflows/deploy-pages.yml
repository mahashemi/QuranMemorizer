name: Deploy QuranMemorizer to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "index.html"
      - "static/**"
      - "assets/**"
      - "data/quran/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "data/hadith/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # One-time bootstrap: generate and commit the deployable Quran chunks if
      # they are absent. Subsequent deployments reuse the committed files.
      - name: Generate and commit Quran chunks if missing
        if: github.ref == 'refs/heads/main'
        run: |
          if [ ! -f data/quran/chunked/manifest.json ]; then
            npm run generate:quran-chunks
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/quran/chunked
            git commit -m "Add generated Quran reading chunks"
            git push origin HEAD:main
          fi

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Build static site with chapter-sized Quran data
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p www/data
          cp -R data/hadith www/data/
          touch www/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
