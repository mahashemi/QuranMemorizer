name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-apk.yml"
      - "scripts/prepare-android.mjs"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "assets/**"
      - "index.html"
      - "static/**"
      - "data/quran/**"
      - "data/hadith/**"
  pull_request:
    paths:
      - ".github/workflows/android-apk.yml"
      - "scripts/prepare-android.mjs"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "assets/**"
      - "index.html"
      - "static/**"
      - "data/quran/**"
      - "data/hadith/**"

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Capacitor web assets
        run: npm run build

      - name: Generate Android platform project
        run: npx cap add android

      - name: Configure microphone permission
        run: node scripts/prepare-android.mjs

      - name: Generate Android launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon.png
          npx capacitor-assets generate --android

      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranMemorizer-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
