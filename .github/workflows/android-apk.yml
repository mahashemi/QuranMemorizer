name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-apk.yml"
      - "scripts/prepare-android.mjs"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "index.html"
      - "static/**"
      - "data/quran/**"
      - "data/hadith/**"

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Capacitor web assets
        run: npm run build

      - name: Generate Android platform project
        run: npx cap add android

      - name: Configure microphone permission
        run: node scripts/prepare-android.mjs

      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranMemorizer-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
