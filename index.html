<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#151a21" />
<title>Quran Player — Minshawi Murattal</title>

<link rel="preconnect" href="https://verses.quran.foundation" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500&display=swap" rel="stylesheet">

<style>
  @font-face {
    font-family: 'UthmanicHafs';
    src: url('https://cdn.jsdelivr.net/gh/thetruetruth/quran-data-kfgqpc@main/hafs/font/hafs.18.woff2') format('woff2'),
         url('https://verses.quran.foundation/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.woff2') format('woff2'),
         url('https://verses.quran.foundation/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.ttf') format('truetype');
    font-display: swap;
    font-weight: 400;
    font-style: normal;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg:#0e1116; --panel:#151a21; --panel-2:#1b222b; --panel-3:#232c37; --border:#252e39;
    --text:#e8eef5; --muted:#8a99a8;
    --accent:#2ecfa1; --accent-soft:rgba(46,207,161,.13); --accent-border:rgba(46,207,161,.5);
    --arabic: 'UthmanicHafs','KFGQPC Uthman Taha Naskh','Amiri Quran','Scheherazade New','Traditional Arabic',serif;
    --urdu: 'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Urdu Typesetting',serif;
    --persian: 'Vazirmatn','Noto Naskh Arabic','Amiri',serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body { height:100%; margin:0; overflow:hidden; }
  body {
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; -webkit-font-smoothing:antialiased;
    overscroll-behavior: none;
  }
  button, select, input { font-family:inherit; font-size:inherit; color:inherit; }
  button { border:0; background:none; padding:0; }

  /* ============ layout ============ */
  .app { display:grid; grid-template-columns:380px 1fr; height:100vh; height:100dvh; overflow:hidden; }

  /* ============ sidebar ============ */
  .sidebar { display:flex; flex-direction:column; min-height:0;
    background:var(--panel); border-right:1px solid var(--border); }
  .sidebar-top { padding:12px 14px; border-bottom:1px solid var(--border); }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand-icon {
    width:34px; height:34px; border-radius:10px; flex:0 0 34px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg,var(--accent),#1b9c78);
    color:#04211a; font-size:18px; font-weight:700;
  }
  .brand-title { font-weight:700; letter-spacing:.2px; }
  .brand-sub { font-size:11px; color:var(--muted); margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:290px; }

  .sidebar-body { flex:1; min-height:0; display:grid; grid-template-columns:220px 1fr; }
  .col { display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .aya-col { border-left:1px solid var(--border); background:rgba(0,0,0,.14); }

  .col-head {
    flex:0 0 auto; padding:7px 12px;
    font-size:10px; text-transform:uppercase; letter-spacing:.8px;
    color:var(--muted); border-bottom:1px solid var(--border);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .col-head b { color:var(--text); font-weight:600; letter-spacing:.2px; }

  .search-wrap { padding:8px 10px; border-bottom:1px solid var(--border); flex:0 0 auto; }
  .search-wrap input {
    width:100%; padding:8px 10px; border-radius:8px;
    background:var(--panel-2); border:1px solid var(--border); outline:none; font-size:13px;
  }
  .search-wrap input:focus { border-color:var(--accent-border); }

  .scroll { flex:1; overflow-y:auto; min-height:0; overscroll-behavior:contain;
    -webkit-overflow-scrolling: touch; }
  .scroll::-webkit-scrollbar { width:9px; }
  .scroll::-webkit-scrollbar-thumb { background:#2b3642; border-radius:6px;
    border:2px solid transparent; background-clip:content-box; }
  .scroll::-webkit-scrollbar-track { background:transparent; }

  .sura-list { padding-bottom:14px; }
  .sura-item {
    display:flex; align-items:center; gap:9px;
    padding:8px 10px; cursor:pointer; user-select:none;
    border-left:3px solid transparent; transition:background .14s;
  }
  .sura-item.current { background:var(--accent-soft); border-left-color:var(--accent); }
  .sura-num {
    flex:0 0 26px; height:26px; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel-2); border:1px solid var(--border);
    font-size:10px; font-weight:700; color:var(--muted);
  }
  .sura-item.current .sura-num { background:var(--accent); color:#04211a; border-color:var(--accent); }
  .sura-names { flex:1; min-width:0; display:flex; flex-direction:column; }
  .sura-names .en { font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sura-names .ar { font-size:15px; color:var(--muted); direction:rtl; text-align:right; line-height:1.35; }
  .sura-item.current .sura-names .ar { color:#7fd9bd; }

  /* --- aya list (desktop) --- */
  .aya-list {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(36px,1fr));
    gap:4px; padding:8px; align-content:start;
  }
  .aya-btn {
    height:34px; border-radius:7px; cursor:pointer;
    background:var(--panel-2); border:1px solid var(--border);
    font-size:11.5px; color:#c3cfdb; transition:.14s;
    display:flex; align-items:center; justify-content:center;
    font-variant-numeric:tabular-nums;
    padding:0;
  }
  .aya-btn .aya-btn-num { display:inline; }
  .aya-btn .aya-btn-text { display:none; }
  .aya-btn.active {
    background:var(--accent); border-color:var(--accent);
    color:#04211a; font-weight:700; box-shadow:0 0 0 2px rgba(46,207,161,.22);
  }
  .aya-empty {
    grid-column:1/-1; padding:18px 10px; text-align:center;
    font-size:11px; color:var(--muted); line-height:1.6;
  }

  @media (hover: hover) {
    .sura-item:hover { background:var(--panel-2); }
    .aya-btn:hover { background:#26313d; border-color:#3a4756; color:#fff; }
  }

  /* ============ main ============ */
  .main { display:flex; flex-direction:column; min-height:0; min-width:0; position:relative; }

  .topbar {
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--border);
    flex:0 0 auto;
  }
  .field { display:flex; align-items:center; gap:8px; }
  .field > label { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); }
  select {
    background:var(--panel-2); border:1px solid var(--border); border-radius:8px;
    padding:8px 10px; outline:none; cursor:pointer; max-width:340px;
  }
  select:focus { border-color:var(--accent-border); }
  .spacer { flex:1; }
  .now { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:320px; }

  .topbar-btn {
    display:inline-flex; align-items:center; gap:6px;
    padding: 8px 14px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
    transition: .15s;
    flex: 0 0 auto;
  }
  .topbar-btn:hover { background:#27313d; border-color:#3b4856; }
  .topbar-btn svg { opacity: .85; }

  /* ============ reader ============ */
  .reader { flex:1; overflow-y:auto; min-height:0; padding:10px 26px 45vh; overscroll-behavior:contain;
    -webkit-overflow-scrolling: touch; }
  .reader::-webkit-scrollbar { width:10px; }
  .reader::-webkit-scrollbar-thumb { background:#2b3642; border-radius:6px;
    border:2px solid var(--panel); background-clip:content-box; }
  .reader::-webkit-scrollbar-track { background:transparent; }

  .sura-heading { max-width:920px; margin:14px auto 22px; text-align:center;
    padding-bottom:16px; border-bottom:1px solid var(--border); }
  .sura-heading h1 { margin:0; font-size:20px; font-weight:700; letter-spacing:.3px; }
  .sura-heading .ar-name { font-size:34px; color:var(--accent); margin-top:8px; direction:rtl; line-height:1.4; }
  .sura-heading .meta { font-size:11px; color:var(--muted); margin-top:6px;
    letter-spacing:.6px; text-transform:uppercase; }

  .aya {
    max-width:920px; margin:0 auto 4px; padding:16px 18px; border-radius:12px;
    border:1px solid transparent; cursor:pointer;
    transition:background .18s, border-color .18s;
  }
  .aya.active { background:var(--accent-soft); border-color:var(--accent-border); }
  .aya-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .aya-num {
    display:inline-flex; align-items:center; justify-content:center;
    min-width:30px; height:26px; padding:0 9px; border-radius:13px;
    background:var(--panel-2); border:1px solid var(--border);
    color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.4px;
  }
  .aya.active .aya-num { background:var(--accent); border-color:var(--accent); color:#04211a; }
  .aya-hint { font-size:10px; color:transparent; transition:color .18s; letter-spacing:.6px; }

  @media (hover: hover) {
    .aya:hover { background:var(--panel-2); }
    .aya:hover .aya-hint { color:var(--muted); }
  }

  .arabic {
    font-family: var(--arabic);
    font-size:32px;
    line-height:2.25;
    direction:rtl;
    text-align:right;
    color:#f2f7fb;
    font-feature-settings: "liga" 1, "calt" 1, "rlig" 1;
    font-kerning: normal;
  }
  .translit {
    margin-top:12px;
    font-size:13px;
    font-style:italic;
    color:var(--muted);
    line-height:1.55;
  }
  .english {
    margin-top:6px;
    font-size:14px;
    color:#b9c6d3;
    line-height:1.55;
  }
  .urdu {
    margin-top:14px;
    padding-top:12px;
    border-top: 1px dashed rgba(255,255,255,.06);
    font-family: var(--urdu);
    font-size: 19px;
    line-height: 2.5;
    direction: rtl;
    text-align: right;
    color: #d4dfe9;
    font-weight: 400;
  }
  .persian {
    margin-top:14px;
    padding-top:12px;
    border-top: 1px dashed rgba(255,255,255,.06);
    font-family: var(--persian);
    font-size: 16px;
    line-height: 2.0;
    direction: rtl;
    text-align: right;
    color: #c8d4e0;
  }

  .arabic:empty,
  .translit:empty,
  .english:empty,
  .urdu:empty,
  .persian:empty { display: none; }

  .reader.hide-translit .translit { display: none; }
  .reader.hide-english .english { display: none; }
  .reader.hide-urdu .urdu { display: none; }
  .reader.hide-persian .persian { display: none; }

  .sura-names .ar,
  .sura-heading .ar-name,
  .aya-btn-text {
    font-family: var(--arabic);
    font-feature-settings: "liga" 1, "calt" 1, "rlig" 1;
    font-kerning: normal;
  }

  /* ============ player ============ */
  .player { flex:0 0 auto; background:var(--panel); border-top:1px solid var(--border);
    padding:10px 16px 12px; padding-bottom: calc(12px + var(--safe-bottom));
    overflow-x: hidden; }
  .progress-row { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .time { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:38px; text-align:center; }
  .progress { flex:1; height:6px; border-radius:4px; background:#232c37;
    cursor:pointer; position:relative; overflow:hidden; }
  .progress-fill { height:100%; width:0;
    background:linear-gradient(90deg,#1fa87d,var(--accent)); border-radius:4px;
    transition:width .1s linear; }

  .controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .icon-btn {
    width:38px; height:38px; border-radius:50%; cursor:pointer;
    background:var(--panel-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:14px; transition:.15s;
    color:var(--text);
    flex: 0 0 auto;
  }
  .icon-btn:active { transform:scale(.94); }
  .icon-btn.primary {
    width:46px; height:46px; font-size:18px;
    background:linear-gradient(145deg,var(--accent),#1fa87d);
    border-color:transparent; color:#04211a;
  }
  .icon-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent-border);
    color: var(--accent);
  }
  @media (hover: hover) {
    .icon-btn:hover { background:#27313d; border-color:#3b4856; }
    .icon-btn.primary:hover { filter:brightness(1.08); }
    .icon-btn.active:hover { background: var(--accent-soft); border-color: var(--accent-border); }
  }

  /* repeat button — mobile only (hidden on desktop) */
  .repeat-btn { display: none; }

  /* ---------- repeat block ---------- */
  .repeat-slot { min-width: 0; }
  .repeat-slot-desktop { display: contents; }
  .repeat-slot-mobile { display: block; }

  .repeat {
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-left:6px;
    padding-left:12px;
    border-left:1px solid var(--border);
    min-width: 0;
  }
  .repeat select { padding:6px 8px; font-size:12px; }

  .opt { display:none; align-items:center; gap:6px; flex-wrap:wrap; }
  .opt.show { display:inline-flex; }

  .opt-field { display:flex; align-items:center; gap:6px; }
  .opt-label { font-size:11px; color:var(--muted); white-space:nowrap; }

  .opt input[type=number] {
    width:52px; padding:6px 6px; border-radius:7px; text-align:center;
    background:var(--panel-2); border:1px solid var(--border); outline:none;
    -webkit-appearance:none; appearance:textfield;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
  }
  .opt input[type=number]::-webkit-outer-spin-button,
  .opt input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .opt input[type=number]:focus { border-color:var(--accent-border); }

  /* each-ayah row : always one row, no wrap */
  .opt-row-each {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-left: 6px;
    flex-wrap: nowrap;
  }

  .range-each-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    margin: 0;
    flex: 0 0 auto;
    white-space: nowrap;
  }
  .range-each-label input { accent-color: var(--accent); cursor: pointer; margin: 0; }

  .opt-inline {
    display: none;
    align-items: center;
    gap: 4px;
    flex: 0 0 auto;
    flex-wrap: nowrap;
  }
  .opt-inline.show { display: inline-flex; }
  .opt-inline input[type=number] {
    width:44px; padding:6px 4px; border-radius:7px; text-align:center;
    background:var(--panel-2); border:1px solid var(--border); outline:none;
    -webkit-appearance:none; appearance:textfield;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .opt-inline input[type=number]::-webkit-outer-spin-button,
  .opt-inline input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .opt-inline input[type=number]:focus { border-color:var(--accent-border); }

  .hint { font-size:11px; color:var(--muted); }
  .status { font-size:11px; color:var(--accent); margin-left:auto;
    letter-spacing:.3px; font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* mobile-only status pill in the player */
  .mobile-status {
    display: none;
    text-align: center;
    font-size: 11.5px;
    color: var(--accent);
    padding: 0;
    margin: 0;
    min-height: 0;
    font-variant-numeric: tabular-nums;
    letter-spacing: .2px;
  }
  .mobile-status:empty { display: none !important; }

  /* ============ mobile header ============ */
  .mobile-header { display:none; }

  /* ============ backdrop ============ */
  .backdrop {
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    opacity:0; pointer-events:none; transition:opacity .22s; z-index:80;
  }
  .backdrop.show { opacity:1; pointer-events:auto; }

  .drawer-tabs { display:none; }

  /* ============ settings sheet ============ */
  .settings-sheet {
    position: fixed;
    bottom: 0;
    left: 50%;
    width: 100%;
    max-width: 480px;
    transform: translate(-50%, 100%);
    transition: transform .3s cubic-bezier(.22,.61,.36,1);
    background: var(--panel);
    border-top: 1px solid var(--border);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    border-radius: 18px 18px 0 0;
    padding: 8px 20px calc(16px + var(--safe-bottom));
    z-index: 95;
    box-shadow: 0 -14px 44px rgba(0,0,0,.55);
    max-height: 85vh;
    overflow-y: auto;
    will-change: transform;
    -webkit-overflow-scrolling: touch;
  }
  .settings-sheet.open { transform: translate(-50%, 0); }
  .settings-sheet::-webkit-scrollbar { width: 8px; }
  .settings-sheet::-webkit-scrollbar-thumb { background:#2b3642; border-radius:6px;
    border:2px solid var(--panel); background-clip:content-box; }
  .settings-sheet::-webkit-scrollbar-track { background:transparent; }

  .sheet-handle {
    width:44px; height:4px; border-radius:2px;
    background:#3b4856; margin:6px auto 12px;
  }
  .sheet-title {
    font-size:15px; font-weight:700; letter-spacing:.3px;
    color:var(--text);
    margin: 0 0 4px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .sheet-section {
    padding: 14px 0 4px;
    border-bottom: 1px solid var(--border);
  }
  .sheet-section:last-of-type { border-bottom: none; padding-bottom: 0; }
  .sheet-section-title {
    font-size:10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .sheet-row {
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:10px 0;
  }
  .sheet-row > label:first-child,
  .sheet-row > span:first-child {
    font-size:14px; color:var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sheet-row .lang-sub {
    font-size: 11px;
    color: var(--muted);
  }
  .sheet-row select {
    flex:1; max-width: 220px;
    font-size:13.5px; padding:9px 10px; border-radius:10px;
  }

  /* repeat section is mobile-only (on desktop the block lives inline) */
  .sheet-section.repeat-section { display: none; }

  /* Done button */
  .sheet-done {
    display: block;
    width: 100%;
    margin: 16px 0 4px;
    padding: 13px 16px;
    background: linear-gradient(145deg, var(--accent), #1fa87d);
    color: #04211a;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .3px;
    border-radius: 12px;
    cursor: pointer;
    transition: filter .15s;
  }
  .sheet-done:active { filter: brightness(.92); }
  @media (hover: hover) {
    .sheet-done:hover { filter: brightness(1.06); }
  }

  .switch {
    position:relative; display:inline-block;
    width:46px; height:28px; flex:0 0 46px;
  }
  .switch input { opacity:0; width:0; height:0; position:absolute; }
  .switch .track {
    position:absolute; inset:0; cursor:pointer;
    background:#2b3642; border-radius:14px;
    transition:.2s;
  }
  .switch .track::before {
    content:''; position:absolute;
    width:22px; height:22px; left:3px; top:3px;
    background:#e8eef5; border-radius:50%;
    transition:.2s;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .switch input:checked + .track { background:var(--accent); }
  .switch input:checked + .track::before { transform: translateX(18px); }

  /* ============ toast ============ */
  .toast {
    position:fixed; left:50%; bottom:calc(120px + var(--safe-bottom));
    transform:translate(-50%,20px);
    background:#232c37; border:1px solid var(--border); color:var(--text);
    padding:11px 18px; border-radius:10px; font-size:13px;
    opacity:0; pointer-events:none; transition:.25s; z-index:100; max-width:88vw;
    box-shadow:0 12px 32px rgba(0,0,0,.4);
  }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  .error-box { max-width:640px; margin:60px auto; background:var(--panel);
    border:1px solid var(--border); border-radius:14px; padding:26px 28px; line-height:1.7; }
  .error-box h2 { margin:0 0 10px; color:#ff8080; font-size:18px; }
  .error-box code { background:var(--panel-2); padding:2px 6px; border-radius:5px; font-size:12px; }
  .error-box pre { background:var(--panel-2); padding:12px 14px; border-radius:8px;
    overflow:auto; font-size:12px; }


  /* ==================================================================
     MOBILE
     ================================================================== */
  @media (max-width: 900px) {

    .app { grid-template-columns:1fr; grid-template-rows:auto 1fr; }

    .mobile-header {
      display:flex; align-items:center; gap:10px;
      padding:10px 12px;
      padding-top: calc(10px + var(--safe-top));
      background:var(--panel);
      border-bottom:1px solid var(--border);
      flex:0 0 auto;
      z-index: 20;
    }
    .hdr-btn {
      width:42px; height:42px; border-radius:12px; flex:0 0 42px;
      background:var(--panel-2); border:1px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      font-size:18px; color:var(--text); cursor:pointer;
      transition:background .15s;
    }
    .hdr-btn:active { background:#27313d; transform:scale(.96); }
    .hdr-title { flex:1; min-width:0; text-align:center; }
    .hdr-title .sura {
      font-size:14px; font-weight:600;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      letter-spacing:.1px;
    }
    .hdr-title .sub {
      font-size:11px; color:var(--muted); margin-top:1px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }

    .topbar { display:none; }

    /* drawer */
    .sidebar {
      position:fixed;
      top:0; bottom:0; left:0;
      width:88vw;
      max-width:380px;
      z-index:90;
      max-height:none; border-right:1px solid var(--border);
      transform:translateX(-100%);
      transition:transform .3s cubic-bezier(.22,.61,.36,1);
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      will-change:transform;
      box-shadow: 6px 0 30px rgba(0,0,0,.45);
    }
    .sidebar.open { transform:translateX(0); }

    .sidebar-top {
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 14px;
      gap:10px;
    }
    .brand { flex:1; min-width:0; }
    .brand-sub { max-width:none; }

    .drawer-tabs {
      display:flex; gap:0; padding:0 12px;
      border-bottom:1px solid var(--border);
      background:var(--panel);
    }
    .drawer-tab {
      flex:1; padding:12px 6px; text-align:center;
      font-size:13px; font-weight:600; color:var(--muted);
      border-bottom:2px solid transparent; cursor:pointer;
      transition:.15s; user-select:none;
    }
    .drawer-tab.active { color:var(--accent); border-bottom-color:var(--accent); }

    .sidebar-body {
      grid-template-columns:1fr !important;
      position:relative;
    }
    .sidebar-body[data-tab="sura"] .aya-col { display:none; }
    .sidebar-body[data-tab="aya"] .sura-col { display:none; }

    .col-head { display:none; }
    .search-wrap { padding:10px 14px; }
    .search-wrap input { font-size:16px; padding:11px 12px; border-radius:10px; }

    .sura-item { padding:12px 14px; gap:12px; }
    .sura-num { width:30px; height:30px; flex:0 0 30px; font-size:11px; border-radius:9px; }
    .sura-names .en { font-size:14.5px; }
    .sura-names .ar { font-size:17px; }

    /* aya list */
    .aya-list {
      display:flex;
      flex-direction:column;
      gap:6px;
      padding:10px 12px 20px;
      align-content:stretch;
    }
    .aya-btn {
      height:auto;
      min-height:60px;
      padding:10px 12px;
      display:flex;
      align-items:center;
      gap:12px;
      justify-content:flex-start;
      text-align:left;
      border-radius:11px;
      font-size:inherit;
      font-weight:inherit;
      box-shadow:none;
      transition: background .14s, border-color .14s;
    }
    .aya-btn .aya-btn-num {
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 34px;
      height:34px;
      border-radius:9px;
      background:rgba(0,0,0,.28);
      border:1px solid var(--border);
      font-size:12px;
      font-weight:700;
      color:var(--muted);
      font-variant-numeric:tabular-nums;
    }
    .aya-btn .aya-btn-text {
      display:block;
      flex:1;
      min-width:0;
      font-size:20px;
      line-height:1.5;
      direction:rtl;
      text-align:right;
      color:#c3cfdb;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      letter-spacing:0;
    }
    .aya-btn.active {
      background:var(--accent-soft);
      border-color:var(--accent-border);
      box-shadow:none;
    }
    .aya-btn.active .aya-btn-num {
      background:var(--accent);
      color:#04211a;
      border-color:var(--accent);
    }
    .aya-btn.active .aya-btn-text { color:#f2f7fb; }

    .aya-empty { padding:26px 12px; font-size:12.5px; }

    /* reader */
    .reader { padding: 8px 16px 40vh; }
    .sura-heading { margin:14px auto 18px; padding-bottom:14px; }
    .sura-heading h1 { font-size:17px; }
    .sura-heading .ar-name { font-size:26px; margin-top:6px; }
    .sura-heading .meta { font-size:10px; }

    .aya { padding:14px 4px; margin:0 auto 2px; border-radius:10px; }
    .aya.active { padding:14px 12px; }
    .aya-top { margin-bottom:6px; }
    .aya-num { height:24px; padding:0 8px; font-size:10.5px; min-width:28px; }
    .aya-hint { display:none; }

    .arabic { font-size:27px; line-height:2.35; }
    .translit { margin-top:10px; font-size:12.5px; }
    .english { font-size:13.5px; line-height:1.6; }
    .urdu { font-size: 17px; line-height: 2.4; margin-top: 12px; padding-top: 10px; }
    .persian { font-size: 14.5px; line-height: 1.9; margin-top: 12px; padding-top: 10px; }

    /* ============ player : compact ============ */
    .player {
      padding: 8px 12px 10px;
      padding-bottom: calc(10px + var(--safe-bottom));
      background:var(--panel);
      box-shadow: 0 -6px 20px rgba(0,0,0,.28);
      z-index:15;
    }
    .progress-row { gap:8px; margin-bottom:6px; }
    .time { font-size:10.5px; min-width:34px; }
    .progress { height:5px; position:relative; }
    .progress::before { content:''; position:absolute; inset:-14px 0; pointer-events:auto; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      flex-wrap: nowrap;
    }
    .icon-btn { width:40px; height:40px; font-size:14px; }
    .icon-btn.primary { width:50px; height:50px; font-size:19px; }

    /* show the mobile repeat button */
    .repeat-btn { display: flex; }

    /* the desktop slot disappears on mobile; repeat block is moved to sheet */
    .repeat-slot-desktop { display: none; }
    .repeat-slot-mobile { display: block; }

    /* hide the inline repeat block on mobile (it lives in the sheet) */
    .player .repeat { display: none; }

    /* mobile status pill in the player */
    .mobile-status {
      display: block;
      padding: 6px 0 0;
      min-height: 16px;
    }
    .mobile-status:empty { display: none; }

    /* ============ repeat block (mobile : inside settings sheet) ============ */
    .settings-sheet .repeat {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      margin: 0;
      padding: 0;
      border-left: none;
      border-top: none;
      width: 100%;
    }

    .settings-sheet .repeat > select#repeatMode {
      width: 100%;
      max-width: none;
      padding: 11px 12px;
      font-size: 14px;
      border-radius: 10px;
      background: var(--panel-2);
    }

    .settings-sheet .opt { display: none; }
    .settings-sheet .opt.show {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    /* SINGLE mode : full-width number */
    .settings-sheet #optSingle.show {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .settings-sheet #optSingle .opt-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: stretch;
      width: 100%;
    }
    .settings-sheet #optSingle .opt-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      text-align: left;
    }
    .settings-sheet #optSingle input[type=number] {
      width: 100%;
      min-width: 0;
      padding: 12px 8px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      border-radius: 10px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      -webkit-appearance: none;
      appearance: textfield;
      font-variant-numeric: tabular-nums;
    }

    /* RANGE mode : 3-col grid for From/To/Times, then each-ayah row */
    .settings-sheet #optRange.show {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      width: 100%;
    }

    .settings-sheet #optRange .opt-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
      align-items: stretch;
    }
    .settings-sheet #optRange .opt-label {
      text-align: center;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      padding: 0 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .settings-sheet #optRange input[type=number] {
      width: 100%;
      min-width: 0;
      padding: 12px 4px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      border-radius: 10px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      -webkit-appearance: none;
      appearance: textfield;
      font-variant-numeric: tabular-nums;
    }
    .settings-sheet #optRange input[type=number]:focus {
      border-color: var(--accent-border);
      background: var(--panel-3);
    }

    .settings-sheet #optRange .opt-zero,
    .settings-sheet #optSingle .opt-zero { display: none; }

    /* each-ayah row : stays on ONE row */
    .settings-sheet .opt-row-each {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: nowrap;
      margin: 4px 0 0;
      padding: 10px 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 100%;
    }
    .settings-sheet .range-each-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text);
      margin: 0;
      padding: 0;
      cursor: pointer;
      flex: 1 1 auto;
      min-width: 0;
    }
    .settings-sheet .range-each-label input[type=checkbox] {
      order: -1;
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      margin: 0;
      accent-color: var(--accent);
    }
    .settings-sheet .opt-inline {
      display: none;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }
    .settings-sheet .opt-inline.show { display: inline-flex; }
    .settings-sheet .opt-inline input[type=number] {
      width: 62px;
      padding: 9px 6px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      border-radius: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      -webkit-appearance: none;
      appearance: textfield;
      font-variant-numeric: tabular-nums;
    }
    .settings-sheet .opt-inline input[type=number]:focus {
      border-color: var(--accent-border);
      background: var(--panel-3);
    }
    .settings-sheet .opt-inline .hint { font-size: 13px; color: var(--muted); }

    /* show the repeat section of the settings sheet */
    .sheet-section.repeat-section { display: block; }

    /* settings sheet on mobile */
    .settings-sheet {
      max-width: 100%;
      border-left: none;
      border-right: none;
      padding: 8px 18px calc(16px + var(--safe-bottom));
    }

    .toast {
      bottom: calc(140px + var(--safe-bottom));
      font-size:12.5px; padding:10px 16px;
    }
  }

  /* very small phones */
  @media (max-width: 360px) {
    .arabic { font-size:24px; line-height:2.3; }
    .urdu { font-size: 16px; line-height: 2.3; }
    .persian { font-size: 14px; }
    .aya-btn { min-height:56px; padding:9px 10px; }
    .aya-btn .aya-btn-text { font-size:18px; }
    .icon-btn { width:38px; height:38px; }
    .icon-btn.primary { width:46px; height:46px; }
    .settings-sheet #optRange.show { gap: 6px; }
  }

  /* landscape phone */
  @media (max-width: 900px) and (orientation: landscape) and (max-height: 520px) {
    .app { grid-template-columns: 300px 1fr; grid-template-rows: 1fr; }
    .mobile-header { display:none; }
    .topbar { display:none; }
    .sidebar {
      position:relative;
      transform:none;
      width:auto; max-width:none;
      padding-top:0; padding-bottom:0;
      border-right:1px solid var(--border);
      box-shadow:none;
      z-index:auto;
    }
    .sidebar-body { grid-template-columns: 130px 1fr; }
    .col-head { display:flex; }
    .drawer-tabs { display:none; }
    .reader { padding:8px 20px 40vh; }
    .player { padding:6px 12px 8px; }
    .repeat-btn { display: none; }
    .mobile-status { display: none; }
  }
</style>
</head>
<body>

<div class="app">

  <header class="mobile-header">
    <button class="hdr-btn" id="btnOpenDrawer" aria-label="Open sura & ayah picker" title="Browse suras & ayat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="hdr-title">
      <div class="sura" id="mobHdrSura">Loading…</div>
      <div class="sub" id="mobHdrSub">—</div>
    </div>
    <button class="hdr-btn" id="btnOpenSettings" aria-label="Settings" title="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span class="brand-icon">☾</span>
        <div style="min-width:0">
          <div class="brand-title">Quran Player</div>
          <div class="brand-sub" id="reciterSub">—</div>
        </div>
      </div>
      <button class="hdr-btn" id="btnCloseDrawer" style="display:none" aria-label="Close" title="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="drawer-tabs" id="drawerTabs">
      <button class="drawer-tab active" data-tab="sura">Sura</button>
      <button class="drawer-tab" data-tab="aya">Aya</button>
    </div>

    <div class="sidebar-body" id="sidebarBody" data-tab="sura">
      <div class="col sura-col">
        <div class="col-head">Sura</div>
        <div class="search-wrap">
          <input id="suraSearch" type="search" placeholder="Search sura…" autocomplete="off" />
        </div>
        <div class="scroll sura-list" id="suraList"></div>
      </div>

      <div class="col aya-col">
        <div class="col-head" id="ayaColHead">Aya</div>
        <div class="scroll aya-list" id="ayaList">
          <div class="aya-empty">Select a sura<br>to see its ayat</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="field">
        <label for="reciterSelect">Reciter</label>
        <select id="reciterSelect" title="Choose reciter"></select>
      </div>
      <div class="spacer"></div>
      <div class="now" id="nowPlaying">Loading…</div>
      <button class="topbar-btn" id="btnOpenSettingsDesktop" title="Display settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Settings
      </button>
    </header>

    <section class="reader" id="reader"></section>

    <footer class="player">
      <div class="progress-row">
        <span class="time" id="curTime">0:00</span>
        <div class="progress" id="progress" title="Seek"><div class="progress-fill" id="progressFill"></div></div>
        <span class="time" id="durTime">0:00</span>
      </div>

      <div class="controls">
        <button id="btnPrev" class="icon-btn" title="Previous aya (←)" aria-label="Previous aya">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>
        </button>
        <button id="btnPlay" class="icon-btn primary" title="Play / Pause (Space)" aria-label="Play">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" id="iconPlay"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="btnNext" class="icon-btn" title="Next aya (→)" aria-label="Next aya">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
        <button id="btnStop" class="icon-btn" title="Stop" aria-label="Stop">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
        </button>

        <!-- mobile-only button : opens the repeat settings sheet -->
        <button id="btnRepeatSettings" class="icon-btn repeat-btn" title="Repeat settings" aria-label="Repeat settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
        </button>

        <!-- desktop slot : the repeat block lives here on desktop -->
        <div class="repeat-slot repeat-slot-desktop" id="repeatSlotDesktop"></div>
      </div>

      <!-- mobile status pill -->
      <div class="mobile-status" id="mobileStatus"></div>
    </footer>
  </main>
</div>

<!-- ========== SETTINGS SHEET ========== -->
<div class="settings-sheet" id="settingsSheet" aria-hidden="true">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Settings</div>

  <!-- Repeat section (mobile only — the block is moved here by JS) -->
  <div class="sheet-section repeat-section">
    <div class="sheet-section-title">Repeat</div>
    <div class="repeat-slot repeat-slot-mobile" id="repeatSlotMobile"></div>
  </div>

  <!-- Reciter -->
  <div class="sheet-section">
    <div class="sheet-section-title">Reciter</div>
    <div class="sheet-row">
      <label for="mobileReciterSelect">Audio reciter</label>
      <select id="mobileReciterSelect" title="Choose reciter"></select>
    </div>
  </div>

  <!-- Translations -->
  <div class="sheet-section">
    <div class="sheet-section-title">Translations</div>

    <div class="sheet-row">
      <span>Transliteration <span class="lang-sub">· Latin</span></span>
      <label class="switch">
        <input type="checkbox" id="toggleTranslit" checked />
        <span class="track"></span>
      </label>
    </div>

    <div class="sheet-row">
      <span>English <span class="lang-sub">· translation</span></span>
      <label class="switch">
        <input type="checkbox" id="toggleEnglish" checked />
        <span class="track"></span>
      </label>
    </div>

    <div class="sheet-row">
      <span>اردو <span class="lang-sub">· Urdu</span></span>
      <label class="switch">
        <input type="checkbox" id="toggleUrdu" checked />
        <span class="track"></span>
      </label>
    </div>

    <div class="sheet-row">
      <span>فارسی <span class="lang-sub">· Persian</span></span>
      <label class="switch">
        <input type="checkbox" id="togglePersian" checked />
        <span class="track"></span>
      </label>
    </div>
  </div>

  <!-- Playback -->
  <div class="sheet-section">
    <div class="sheet-section-title">Playback</div>
    <div class="sheet-row">
      <span>Play Bismillah before sura</span>
      <label class="switch">
        <input type="checkbox" id="mobileToggleBismillah" checked />
        <span class="track"></span>
      </label>
    </div>
  </div>

  <button class="sheet-done" id="sheetDone" type="button">Done</button>
</div>

<!-- ========== REPEAT BLOCK (single instance, moved by JS) ========== -->
<!-- This is defined once and physically moved between the desktop slot and the mobile slot. -->
<template id="repeatBlockTemplate">
  <div class="repeat" id="repeatBlock">
    <select id="repeatMode" title="Repeat mode">
      <option value="none">No repeat</option>
      <option value="single">Repeat aya</option>
      <option value="range">Repeat range</option>
    </select>

    <div class="opt" id="optSingle">
      <div class="opt-field">
        <label class="opt-label" for="singleCount">Times</label>
        <input type="number" id="singleCount" min="0" value="3" inputmode="numeric" title="How many times to repeat" />
      </div>
      <span class="hint opt-zero">(0 = ∞)</span>
    </div>

    <div class="opt" id="optRange">
      <div class="opt-field">
        <label class="opt-label" for="rangeFrom">From</label>
        <input type="number" id="rangeFrom" min="1" value="1" inputmode="numeric" title="First ayah of the range" />
      </div>
      <div class="opt-field">
        <label class="opt-label" for="rangeTo">To</label>
        <input type="number" id="rangeTo" min="1" value="7" inputmode="numeric" title="Last ayah of the range" />
      </div>
      <div class="opt-field">
        <label class="opt-label" for="rangeCount">Times</label>
        <input type="number" id="rangeCount" min="0" value="3" inputmode="numeric" title="How many times to loop the range" />
      </div>
      <span class="hint opt-zero">(0 = ∞)</span>

      <div class="opt-row-each">
        <label class="check range-each-label" title="Play each ayah N times before moving to the next">
          <input type="checkbox" id="repeatEachAyah" />
          <span>Each ayah</span>
        </label>
        <span class="opt-inline" id="repeatEachWrap">
          <input type="number" id="repeatEachCount" min="1" value="3" inputmode="numeric" title="How many times to repeat each ayah" />
          <span class="hint">×</span>
        </span>
      </div>
    </div>

    <span class="status" id="status"></span>
  </div>
</template>

<div class="backdrop" id="drawerBackdrop"></div>
<div class="backdrop" id="settingsBackdrop"></div>

<div class="toast" id="toast"></div>

<script>
(function () {
'use strict';

/* ==================================================================
   1. RECITERS
   ================================================================== */
const RECITERS = [
  { id: 'minshawi_murattal', name: 'Minshawi Murattal — Mohamed Siddiq El-Minshawi', dir: 'data/audio/minshawi_murattal' }
];

/* ==================================================================
   2. SURA ENGLISH NAMES
   ================================================================== */
const SURA_ENGLISH = [
  "Al-Fatihah","Al-Baqarah","Ali 'Imran","An-Nisa","Al-Ma'idah","Al-An'am","Al-A'raf","Al-Anfal",
  "At-Tawbah","Yunus","Hud","Yusuf","Ar-Ra'd","Ibrahim","Al-Hijr","An-Nahl",
  "Al-Isra","Al-Kahf","Maryam","Ta-Ha","Al-Anbiya","Al-Hajj","Al-Mu'minun","An-Nur",
  "Al-Furqan","Ash-Shu'ara","An-Naml","Al-Qasas","Al-Ankabut","Ar-Rum","Luqman","As-Sajdah",
  "Al-Ahzab","Saba","Fatir","Ya-Sin","As-Saffat","Sad","Az-Zumar","Ghafir",
  "Fussilat","Ash-Shura","Az-Zukhruf","Ad-Dukhan","Al-Jathiyah","Al-Ahqaf","Muhammad","Al-Fath",
  "Al-Hujurat","Qaf","Adh-Dhariyat","At-Tur","An-Najm","Al-Qamar","Ar-Rahman","Al-Waqi'ah",
  "Al-Hadid","Al-Mujadilah","Al-Hashr","Al-Mumtahanah","As-Saff","Al-Jumu'ah","Al-Munafiqun","At-Taghabun",
  "At-Talaq","At-Tahrim","Al-Mulk","Al-Qalam","Al-Haqqah","Al-Ma'arij","Nuh","Al-Jinn",
  "Al-Muzzammil","Al-Muddaththir","Al-Qiyamah","Al-Insan","Al-Mursalat","An-Naba","An-Nazi'at","Abasa",
  "At-Takwir","Al-Infitar","Al-Mutaffifin","Al-Inshiqaq","Al-Buruj","At-Tariq","Al-A'la","Al-Ghashiyah",
  "Al-Fajr","Al-Balad","Ash-Shams","Al-Layl","Ad-Duha","Ash-Sharh","At-Tin","Al-Alaq",
  "Al-Qadr","Al-Bayyinah","Az-Zalzalah","Al-Adiyat","Al-Qari'ah","At-Takathur","Al-Asr","Al-Humazah",
  "Al-Fil","Quraysh","Al-Ma'un","Al-Kawthar","Al-Kafirun","An-Nasr","Al-Masad","Al-Ikhlas",
  "Al-Falaq","An-Nas"
];

/* ==================================================================
   3. HELPERS
   ================================================================== */
const $ = id => document.getElementById(id);
const pad3 = n => String(n).padStart(3, '0');
const esc = s => String(s == null ? '' : s)
  .replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtTime = t => {
  if (!isFinite(t) || t < 0) t = 0;
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + String(s).padStart(2, '0');
};
const clampInt = (v, lo, hi) => {
  let n = parseInt(v, 10);
  if (isNaN(n)) n = lo;
  return Math.max(lo, Math.min(hi, n));
};
const isMobile = () => window.matchMedia('(max-width: 900px)').matches
  && !window.matchMedia('(max-width: 900px) and (orientation: landscape) and (max-height: 520px)').matches;

/* ==================================================================
   4. DOM REFS (elements below are filled after we inject the repeat block)
   ================================================================== */
const el = {
  sidebar: $('sidebar'),
  sidebarBody: $('sidebarBody'),
  suraList: $('suraList'), suraSearch: $('suraSearch'),
  ayaList: $('ayaList'), ayaColHead: $('ayaColHead'),

  reader: $('reader'),
  reciterSelect: $('reciterSelect'), reciterSub: $('reciterSub'),
  nowPlaying: $('nowPlaying'),

  progress: $('progress'), progressFill: $('progressFill'),
  curTime: $('curTime'), durTime: $('durTime'),
  btnPlay: $('btnPlay'), btnPrev: $('btnPrev'), btnNext: $('btnNext'), btnStop: $('btnStop'),
  iconPlay: $('iconPlay'),
  btnRepeatSettings: $('btnRepeatSettings'),
  mobileStatus: $('mobileStatus'),

  mobHdrSura: $('mobHdrSura'), mobHdrSub: $('mobHdrSub'),

  btnOpenDrawer: $('btnOpenDrawer'), btnCloseDrawer: $('btnCloseDrawer'),
  drawerTabs: $('drawerTabs'), drawerBackdrop: $('drawerBackdrop'),

  settingsSheet: $('settingsSheet'), settingsBackdrop: $('settingsBackdrop'),
  btnOpenSettings: $('btnOpenSettings'),
  btnOpenSettingsDesktop: $('btnOpenSettingsDesktop'),
  sheetDone: $('sheetDone'),
  repeatSlotDesktop: $('repeatSlotDesktop'),
  repeatSlotMobile: $('repeatSlotMobile'),
  mobileReciterSelect: $('mobileReciterSelect'),
  toggleTranslit: $('toggleTranslit'),
  toggleEnglish: $('toggleEnglish'),
  toggleUrdu: $('toggleUrdu'),
  togglePersian: $('togglePersian'),
  mobileToggleBismillah: $('mobileToggleBismillah'),

  toast: $('toast')
};

/* Repeat block element refs — populated after injecting the template */
let repeatEls = {};

/* ==================================================================
   5. STATE
   ================================================================== */
let SURAS = [];
let SURA_BY_NUM = {};

const state = {
  sura: 1, aya: 1,
  playingAya: null,
  started: false,
  repeatMode: 'none',

  singleCount: 3, singleCounter: 0,

  rangeFrom: 1, rangeTo: 7, rangeCount: 3, rangeLoops: 0,
  repeatEach: false,
  repeatEachCount: 3,
  ayaInner: 0,

  reciter: RECITERS[0].id,
  playBismillah: true,

  showTranslit: true,
  showEnglish: true,
  showUrdu: true,
  showPersian: true
};

let configDirty = true;

const PREFS_KEY = 'quranPlayer.displayPrefs.v1';

function loadDisplayPrefs() {
  try {
    const saved = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
    if (typeof saved.translit === 'boolean') state.showTranslit = saved.translit;
    if (typeof saved.english === 'boolean') state.showEnglish = saved.english;
    if (typeof saved.urdu === 'boolean')    state.showUrdu = saved.urdu;
    if (typeof saved.persian === 'boolean') state.showPersian = saved.persian;
    if (typeof saved.bismillah === 'boolean') state.playBismillah = saved.bismillah;
  } catch (e) { /* ignore */ }
}
function saveDisplayPrefs() {
  try {
    localStorage.setItem(PREFS_KEY, JSON.stringify({
      translit: state.showTranslit,
      english: state.showEnglish,
      urdu: state.showUrdu,
      persian: state.showPersian,
      bismillah: state.playBismillah
    }));
  } catch (e) { /* ignore */ }
}

/* ==================================================================
   6. AUDIO
   ================================================================== */
const audio = new Audio();
audio.preload = 'auto';

/* ==================================================================
   7. INIT
   ================================================================== */
async function init() {
  injectRepeatBlock();
  loadDisplayPrefs();
  buildReciterSelects();
  syncDisplayTogglesUI();
  applyDisplayClasses();
  showMobileHeader();
  positionRepeatBlock();

  try {
    const res = await fetch('data/quran/all_suras.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
    const raw = await res.json();
    buildSuras(raw);
  } catch (err) {
    el.reader.innerHTML =
      '<div class="error-box">' +
        '<h2>Could not load the Qur’an data</h2>' +
        '<p><b>' + esc(err.message) + '</b></p>' +
        '<p>Make sure you start the server from the folder that contains ' +
        '<code>index.html</code> and the <code>data/</code> directory:</p>' +
        '<pre>cd /path/to/simple_quran\npython3 -m http.server 8000</pre>' +
        '<p>Then open <code>http://localhost:8000/</code></p>' +
      '</div>';
    el.nowPlaying.textContent = 'Data not loaded';
    return;
  }
  buildSidebar();
  bindEvents();
  bindRepeatEvents();
  loadSura(1, { aya: 1, play: false });
}

/* Inject the repeat block from the template into the DOM (into the desktop slot by default) */
function injectRepeatBlock() {
  const tpl = document.getElementById('repeatBlockTemplate');
  const fragment = tpl.content.cloneNode(true);
  const block = fragment.querySelector('#repeatBlock');
  el.repeatSlotDesktop.appendChild(fragment);

  // Cache all its inner elements
  repeatEls = {
    block,
    repeatMode: block.querySelector('#repeatMode'),
    optSingle: block.querySelector('#optSingle'),
    optRange: block.querySelector('#optRange'),
    singleCount: block.querySelector('#singleCount'),
    rangeFrom: block.querySelector('#rangeFrom'),
    rangeTo: block.querySelector('#rangeTo'),
    rangeCount: block.querySelector('#rangeCount'),
    repeatEachAyah: block.querySelector('#repeatEachAyah'),
    repeatEachCount: block.querySelector('#repeatEachCount'),
    repeatEachWrap: block.querySelector('#repeatEachWrap'),
    status: block.querySelector('#status')
  };
}

/* Move the block between the desktop slot and the mobile slot based on viewport */
function positionRepeatBlock() {
  const block = repeatEls.block;
  if (!block) return;
  const target = isMobile() ? el.repeatSlotMobile : el.repeatSlotDesktop;
  if (block.parentElement !== target) {
    target.appendChild(block);
  }
}

function buildSuras(raw) {
  SURAS = Object.keys(raw).map(key => {
    const m = key.match(/سورة\s+(\d+)/);
    if (!m) return null;
    const number = parseInt(m[1], 10);
    if (!number) return null;
    const arabicName = (key.split(/[-–—]/)[0] || '').replace(/سورة/g, '').trim();
    const ayas = (raw[key] || []).map((v, i) => ({ ...v, ayaNum: i + 1 }));
    return {
      number, arabicName,
      englishName: SURA_ENGLISH[number - 1] || ('Sura ' + number),
      ayas
    };
  }).filter(Boolean).sort((a, b) => a.number - b.number);
  SURA_BY_NUM = {};
  SURAS.forEach(s => { SURA_BY_NUM[s.number] = s; });
}

/* ==================================================================
   8. RECITER SELECTS
   ================================================================== */
function buildReciterSelects() {
  const opts = RECITERS.map(r =>
    '<option value="' + esc(r.id) + '">' + esc(r.name) + '</option>'
  ).join('');
  el.reciterSelect.innerHTML = opts;
  el.mobileReciterSelect.innerHTML = opts;
  syncReciterUI();
}
function syncReciterUI() {
  el.reciterSelect.value = state.reciter;
  el.mobileReciterSelect.value = state.reciter;
  el.reciterSub.textContent = currentReciter().name;
}
function currentReciter() {
  return RECITERS.find(r => r.id === state.reciter) || RECITERS[0];
}

/* ==================================================================
   9. SIDEBAR
   ================================================================== */
function buildSidebar() {
  const frag = document.createDocumentFragment();
  SURAS.forEach(s => {
    const item = document.createElement('div');
    item.className = 'sura-item';
    item.dataset.sura = s.number;
    item.dataset.search = (s.number + ' ' + s.englishName + ' ' + s.arabicName).toLowerCase();
    item.innerHTML =
      '<span class="sura-num">' + s.number + '</span>' +
      '<span class="sura-names">' +
        '<span class="en">' + esc(s.englishName) + '</span>' +
        '<span class="ar" dir="rtl">' + esc(s.arabicName) + '</span>' +
      '</span>';
    frag.appendChild(item);
  });
  el.suraList.appendChild(frag);
}

function markCurrentSura() {
  el.suraList.querySelectorAll('.sura-item.current').forEach(i => i.classList.remove('current'));
  const item = el.suraList.querySelector('.sura-item[data-sura="' + state.sura + '"]');
  if (item) {
    item.classList.add('current');
    item.scrollIntoView({ block: 'nearest' });
  }
}

/* ==================================================================
   10. AYA LIST
   ================================================================== */
function renderAyaList(num) {
  const s = SURA_BY_NUM[num];
  if (!s) { el.ayaList.innerHTML = ''; return; }

  el.ayaColHead.innerHTML = '<b>' + esc(s.englishName) + '</b> · ' + s.ayas.length;

  let html = '';
  for (const v of s.ayas) {
    const raw = (v.arabic_text || '').trim();
    const preview = raw.length > 100 ? raw.slice(0, 100) : raw;
    html +=
      '<button class="aya-btn" data-aya="' + v.ayaNum + '" title="Aya ' + v.ayaNum + '">' +
        '<span class="aya-btn-num">' + v.ayaNum + '</span>' +
        '<span class="aya-btn-text" dir="rtl" lang="ar">' + esc(preview) + '</span>' +
      '</button>';
  }
  el.ayaList.innerHTML = html;
  el.ayaList.scrollTop = 0;
}

/* ==================================================================
   11. READER
   ================================================================== */
function renderSura() {
  const s = SURA_BY_NUM[state.sura];
  if (!s) return;

  let html =
    '<div class="sura-heading">' +
      '<h1>' + s.number + '. ' + esc(s.englishName) + '</h1>' +
      '<div class="ar-name" dir="rtl">' + esc(s.arabicName) + '</div>' +
      '<div class="meta">' + s.ayas.length + ' ayat</div>' +
    '</div>';

  for (const v of s.ayas) {
    html +=
      '<article class="aya" id="aya-' + v.ayaNum + '" data-aya="' + v.ayaNum + '">' +
        '<div class="aya-top">' +
          '<span class="aya-num">' + v.ayaNum + '</span>' +
          '<span class="aya-hint">click to play</span>' +
        '</div>' +
        '<div class="arabic" dir="rtl" lang="ar">' + esc(v.arabic_text || '') + '</div>' +
        '<div class="translit">' + esc(v.transliteration || '') + '</div>' +
        '<div class="english">' + esc(v.english_text || '') + '</div>' +
        '<div class="urdu" dir="rtl" lang="ur">' + esc(v.urdu_text || '') + '</div>' +
        '<div class="persian" dir="rtl" lang="fa">' + esc(v.persian_text || '') + '</div>' +
      '</article>';
  }
  el.reader.innerHTML = html;
  el.reader.scrollTop = 0;
}

/* ==================================================================
   12. DISPLAY TOGGLES
   ================================================================== */
function applyDisplayClasses() {
  el.reader.classList.toggle('hide-translit', !state.showTranslit);
  el.reader.classList.toggle('hide-english', !state.showEnglish);
  el.reader.classList.toggle('hide-urdu', !state.showUrdu);
  el.reader.classList.toggle('hide-persian', !state.showPersian);
}

function syncDisplayTogglesUI() {
  el.toggleTranslit.checked = state.showTranslit;
  el.toggleEnglish.checked = state.showEnglish;
  el.toggleUrdu.checked = state.showUrdu;
  el.togglePersian.checked = state.showPersian;
  el.mobileToggleBismillah.checked = state.playBismillah;
}

/* ==================================================================
   13. UI SYNC
   ================================================================== */
function updateAyaUI(scrollReader) {
  const s = SURA_BY_NUM[state.sura];
  if (!s) return;

  el.reader.querySelectorAll('.aya.active').forEach(n => n.classList.remove('active'));
  const card = document.getElementById('aya-' + state.aya);
  if (card) {
    card.classList.add('active');
    if (scrollReader !== false) {
      card.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }

  el.ayaList.querySelectorAll('.aya-btn.active').forEach(b => b.classList.remove('active'));
  const btn = el.ayaList.querySelector('.aya-btn[data-aya="' + state.aya + '"]');
  if (btn) {
    btn.classList.add('active');
    btn.scrollIntoView({ block: 'nearest' });
  }

  markCurrentSura();

  const line = s.number + '. ' + s.englishName + '  ·  Aya ' + state.aya + ' / ' + s.ayas.length;
  el.nowPlaying.textContent = line;
  showMobileHeader();

  updateStatus();
}

function showMobileHeader() {
  const s = SURA_BY_NUM[state.sura];
  if (!s) return;
  el.mobHdrSura.textContent = s.englishName;
  el.mobHdrSub.textContent = 'Aya ' + state.aya + ' of ' + s.ayas.length;
}

function updateStatus() {
  let txt = '';
  if (state.repeatMode === 'single') {
    const total = state.singleCount === 0 ? '∞' : state.singleCount;
    txt = 'Aya repeat ' + state.singleCounter + ' / ' + total;

  } else if (state.repeatMode === 'range') {
    const total = state.rangeCount === 0 ? '∞' : state.rangeCount;
    const shownLoop = state.rangeCount === 0
      ? (state.rangeLoops + 1)
      : Math.min(state.rangeLoops + 1, state.rangeCount);

    txt = 'Range ' + state.rangeFrom + '–' + state.rangeTo;
    if (state.repeatEach) {
      const eachDone = Math.min(state.ayaInner + 1, state.repeatEachCount);
      txt += '  ·  aya ' + eachDone + '/' + state.repeatEachCount;
    }
    txt += '  ·  loop ' + shownLoop + '/' + total;
  }

  if (repeatEls.status) repeatEls.status.textContent = txt;
  if (el.mobileStatus) el.mobileStatus.textContent = txt;

  // the repeat icon button in the mobile player becomes highlighted when a repeat mode is active
  if (el.btnRepeatSettings) {
    el.btnRepeatSettings.classList.toggle('active', state.repeatMode !== 'none');
  }
}

function updateOpts() {
  if (!repeatEls.optSingle) return;
  repeatEls.optSingle.classList.toggle('show', state.repeatMode === 'single');
  repeatEls.optRange.classList.toggle('show', state.repeatMode === 'range');
  repeatEls.repeatEachWrap.classList.toggle('show', state.repeatEach);
}

function syncRangeInputs() {
  const s = SURA_BY_NUM[state.sura];
  if (!s) return;
  const total = s.ayas.length;
  repeatEls.rangeFrom.max = total;
  repeatEls.rangeTo.max = total;

  if (state.rangeTo > total) state.rangeTo = total;
  if (state.rangeTo < 1) state.rangeTo = 1;
  if (state.rangeFrom > total) state.rangeFrom = total;
  if (state.rangeFrom < 1) state.rangeFrom = 1;
  if (state.rangeFrom > state.rangeTo) state.rangeFrom = state.rangeTo;

  repeatEls.rangeFrom.value = state.rangeFrom;
  repeatEls.rangeTo.value = state.rangeTo;
}

function resetCounters() {
  state.singleCounter = 0;
  state.rangeLoops = 0;
  state.ayaInner = 0;
}

/* ==================================================================
   14. PLAYBACK ENGINE
   ================================================================== */
function trackUrl(sura, aya) {
  return currentReciter().dir + '/' + pad3(sura) + pad3(aya) + '.mp3';
}

function hasOpening(sura) { return sura !== 1 && sura !== 9; }

function loadSura(num, opts) {
  opts = opts || {};
  const s = SURA_BY_NUM[num];
  if (!s) return;

  const aya = Math.max(1, Math.min(opts.aya || 1, s.ayas.length));
  const suraChanged = state.sura !== num;

  state.sura = num;
  state.aya = aya;

  if (suraChanged) {
    renderSura();
    syncRangeInputs();
    resetCounters();
  }
  renderAyaList(num);
  updateAyaUI(true);

  if (isMobile()) setDrawerTab('aya');

  if (opts.play) {
    goToAya(state.aya, { play: true, opening: opts.opening !== false && state.aya === 1 });
  }
}

function goToAya(aya, opts) {
  opts = opts || {};
  const s = SURA_BY_NUM[state.sura];
  if (!s) return;

  const n = Math.max(1, Math.min(aya, s.ayas.length));
  state.aya = n;
  state.ayaInner = 0;
  updateAyaUI(true);

  if (opts.play) {
    if (opts.opening && n === 1 && state.playBismillah && hasOpening(state.sura)) {
      playTrack(state.sura, 0);
    } else {
      playTrack(state.sura, n);
    }
  }
}

function playTrack(sura, aya) {
  state.playingAya = aya;
  state.started = true;
  audio.src = trackUrl(sura, aya);
  audio.play().catch(err => {
    if (err && err.name === 'NotAllowedError') {
      toast('Browser blocked autoplay — press ▶ to start.');
    }
  });
}

function replayCurrent() {
  try { audio.currentTime = 0; } catch (e) {}
  audio.play().catch(() => {});
}

function stopAll() {
  audio.pause();
  try { audio.currentTime = 0; } catch (e) {}
  resetCounters();
  updateStatus();
}

function startPlayback() {
  configDirty = false;
  if (state.repeatMode === 'range') {
    const s = SURA_BY_NUM[state.sura];
    const total = s ? s.ayas.length : 1;
    state.rangeFrom = clampInt(state.rangeFrom, 1, total);
    state.rangeTo   = clampInt(state.rangeTo, state.rangeFrom, total);
    state.aya = state.rangeFrom;
    updateAyaUI(true);
  }
  resetCounters();
  goToAya(state.aya, { play: true, opening: state.aya === 1 });
}

function handleEnded() {
  const s = SURA_BY_NUM[state.sura];
  if (!s) return;
  const total = s.ayas.length;

  if (state.repeatMode === 'single') {
    state.singleCounter++;
    if (state.singleCount === 0 || state.singleCounter < state.singleCount) {
      updateStatus();
      replayCurrent();
      return;
    }
    state.singleCounter = 0;
    updateStatus();
    if (state.aya < total) goToAya(state.aya + 1, { play: true });
    else stopAll();
    return;
  }

  if (state.repeatMode === 'range') {
    if (state.repeatEach) {
      state.ayaInner++;
      if (state.ayaInner < state.repeatEachCount) {
        updateStatus();
        replayCurrent();
        return;
      }
    }
    if (state.aya < state.rangeTo) {
      goToAya(state.aya + 1, { play: true });
      return;
    }
    state.rangeLoops++;
    if (state.rangeCount === 0 || state.rangeLoops < state.rangeCount) {
      updateStatus();
      goToAya(state.rangeFrom, { play: true });
      return;
    }
    state.rangeLoops = 0;
    updateStatus();
    stopAll();
    toast('Range finished — ' + state.rangeCount + ' loop(s) done.');
    return;
  }

  if (state.aya < total) goToAya(state.aya + 1, { play: true });
  else stopAll();
}

/* ==================================================================
   15. AUDIO EVENTS
   ================================================================== */
audio.addEventListener('ended', () => {
  if (state.playingAya === 0) {
    goToAya(1, { play: true, opening: false });
    return;
  }
  handleEnded();
});

audio.addEventListener('play',  () => { setPlayIcon(true); });
audio.addEventListener('pause', () => { setPlayIcon(false); });

function setPlayIcon(playing) {
  el.iconPlay.innerHTML = playing
    ? '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

audio.addEventListener('timeupdate', () => {
  const d = audio.duration || 0;
  const c = audio.currentTime || 0;
  el.progressFill.style.width = d ? (c / d * 100) + '%' : '0%';
  el.curTime.textContent = fmtTime(c);
  el.durTime.textContent = fmtTime(d);
});

audio.addEventListener('loadedmetadata', () => {
  el.durTime.textContent = fmtTime(audio.duration);
});

audio.addEventListener('error', () => {
  if (state.playingAya === 0) {
    goToAya(1, { play: true, opening: false });
    return;
  }
  const src = audio.src || '';
  toast('Audio file not found: ' + src.split('/').pop());
  stopAll();
});

/* ==================================================================
   16. INPUT HELPERS
   ================================================================== */
function wireNumberInput(inputEl, key, min, max, onUpdate) {
  const commit = () => {
    const prev = state[key];
    const n = parseInt(inputEl.value, 10);
    state[key] = isNaN(n) ? prev : clampInt(n, min, max);
    inputEl.value = state[key];
    configDirty = true;
    resetCounters();
    if (onUpdate) onUpdate();
    updateStatus();
  };
  inputEl.addEventListener('change', commit);
  inputEl.addEventListener('blur',   commit);
  inputEl.addEventListener('input', () => {
    const n = parseInt(inputEl.value, 10);
    if (!isNaN(n)) {
      state[key] = Math.max(min, Math.min(max, n));
      configDirty = true;
      resetCounters();
      if (onUpdate) onUpdate();
      updateStatus();
    }
  });
}

/* ==================================================================
   17. DRAWER / SETTINGS
   ================================================================== */
function openDrawer() {
  el.sidebar.classList.add('open');
  el.drawerBackdrop.classList.add('show');
  document.body.style.overflow = 'hidden';

  if (el.sidebarBody.dataset.tab === 'aya') {
    setTimeout(() => {
      const active = el.ayaList.querySelector('.aya-btn.active');
      if (active) active.scrollIntoView({ block: 'center', behavior: 'auto' });
    }, 320);
  }
}
function closeDrawer() {
  el.sidebar.classList.remove('open');
  el.drawerBackdrop.classList.remove('show');
  document.body.style.overflow = '';
}
function setDrawerTab(name) {
  el.sidebarBody.dataset.tab = name;
  el.drawerTabs.querySelectorAll('.drawer-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === name);
  });
}
function openSettings() {
  el.settingsSheet.classList.add('open');
  el.settingsBackdrop.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeSettings() {
  el.settingsSheet.classList.remove('open');
  el.settingsBackdrop.classList.remove('show');
  document.body.style.overflow = '';
}

/* ==================================================================
   18. REPEAT BLOCK EVENTS (wired once, elements never replaced)
   ================================================================== */
function bindRepeatEvents() {
  const r = repeatEls;

  r.repeatMode.addEventListener('change', () => {
    state.repeatMode = r.repeatMode.value;
    configDirty = true;
    resetCounters();

    if (state.repeatMode === 'range') {
      const s = SURA_BY_NUM[state.sura];
      const total = s ? s.ayas.length : 1;
      if (state.aya < state.rangeFrom || state.aya > state.rangeTo) {
        state.rangeFrom = state.aya;
        state.rangeTo = Math.min(state.aya, total);
      }
      syncRangeInputs();
    }
    updateOpts();
    updateStatus();
  });

  wireNumberInput(r.singleCount, 'singleCount', 0, 9999);

  wireNumberInput(r.rangeFrom, 'rangeFrom', 1, 9999, () => {
    const total = (SURA_BY_NUM[state.sura] || { ayas: [] }).ayas.length || 1;
    state.rangeFrom = clampInt(state.rangeFrom, 1, total);
    if (state.rangeFrom > state.rangeTo) state.rangeTo = state.rangeFrom;
    syncRangeInputs();
  });

  wireNumberInput(r.rangeTo, 'rangeTo', 1, 9999, () => {
    const total = (SURA_BY_NUM[state.sura] || { ayas: [] }).ayas.length || 1;
    state.rangeTo = clampInt(state.rangeTo, 1, total);
    if (state.rangeTo < state.rangeFrom) state.rangeFrom = state.rangeTo;
    syncRangeInputs();
  });

  wireNumberInput(r.rangeCount, 'rangeCount', 0, 9999);
  wireNumberInput(r.repeatEachCount, 'repeatEachCount', 1, 9999);

  r.repeatEachAyah.addEventListener('change', () => {
    state.repeatEach = r.repeatEachAyah.checked;
    configDirty = true;
    resetCounters();
    updateOpts();
    updateStatus();
  });
}

/* ==================================================================
   19. EVENTS
   ================================================================== */
function bindEvents() {

  /* --- sura column --- */
  el.suraList.addEventListener('click', e => {
    const item = e.target.closest('.sura-item');
    if (!item) return;
    loadSura(+item.dataset.sura, { aya: 1, play: true, opening: true });
    if (isMobile()) setTimeout(closeDrawer, 140);
  });

  /* --- aya column --- */
  el.ayaList.addEventListener('click', e => {
    const btn = e.target.closest('.aya-btn');
    if (!btn) return;
    const n = +btn.dataset.aya;
    goToAya(n, { play: true, opening: n === 1 });
    if (isMobile()) setTimeout(closeDrawer, 140);
  });

  /* --- sura search --- */
  el.suraSearch.addEventListener('input', () => {
    const q = el.suraSearch.value.trim().toLowerCase();
    el.suraList.querySelectorAll('.sura-item').forEach(item => {
      const hit = !q || item.dataset.search.indexOf(q) !== -1;
      item.style.display = hit ? '' : 'none';
    });
  });

  /* --- reader click --- */
  el.reader.addEventListener('click', e => {
    const card = e.target.closest('.aya');
    if (!card) return;
    const sel = window.getSelection && String(window.getSelection());
    if (sel && sel.length > 0) return;
    const n = +card.dataset.aya;
    goToAya(n, { play: true, opening: n === 1 });
  });

  /* --- transport --- */
  el.btnPlay.addEventListener('click', () => {
    if (!audio.paused) { audio.pause(); return; }
    if (configDirty || !state.started || !audio.src) startPlayback();
    else audio.play().catch(() => {});
  });

  el.btnNext.addEventListener('click', () => {
    const s = SURA_BY_NUM[state.sura];
    if (!s) return;
    if (state.aya < s.ayas.length) goToAya(state.aya + 1, { play: true });
    else stopAll();
  });

  el.btnPrev.addEventListener('click', () => {
    if (audio.currentTime > 3 && state.playingAya !== null) { replayCurrent(); return; }
    if (state.aya > 1) goToAya(state.aya - 1, { play: true });
    else replayCurrent();
  });

  el.btnStop.addEventListener('click', stopAll);

  /* --- mobile repeat icon button : opens settings sheet --- */
  el.btnRepeatSettings.addEventListener('click', () => {
    openSettings();
    // give the sheet a moment to open, then scroll the repeat section into view
    setTimeout(() => {
      const section = el.settingsSheet.querySelector('.repeat-section');
      if (section) section.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }, 320);
  });

  /* --- progress seek --- */
  el.progress.addEventListener('click', e => {
    if (!audio.duration) return;
    const rect = el.progress.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    audio.currentTime = pct * audio.duration;
  });

  /* --- display toggles --- */
  el.toggleTranslit.addEventListener('change', () => {
    state.showTranslit = el.toggleTranslit.checked;
    applyDisplayClasses();
    saveDisplayPrefs();
  });
  el.toggleEnglish.addEventListener('change', () => {
    state.showEnglish = el.toggleEnglish.checked;
    applyDisplayClasses();
    saveDisplayPrefs();
  });
  el.toggleUrdu.addEventListener('change', () => {
    state.showUrdu = el.toggleUrdu.checked;
    applyDisplayClasses();
    saveDisplayPrefs();
  });
  el.togglePersian.addEventListener('change', () => {
    state.showPersian = el.togglePersian.checked;
    applyDisplayClasses();
    saveDisplayPrefs();
  });
  el.mobileToggleBismillah.addEventListener('change', () => {
    state.playBismillah = el.mobileToggleBismillah.checked;
    saveDisplayPrefs();
  });

  /* --- reciter selects --- */
  el.reciterSelect.addEventListener('change', () => setReciter(el.reciterSelect.value));
  el.mobileReciterSelect.addEventListener('change', () => setReciter(el.mobileReciterSelect.value));

  /* --- drawer --- */
  el.btnOpenDrawer.addEventListener('click', openDrawer);
  el.btnCloseDrawer.addEventListener('click', closeDrawer);
  el.drawerBackdrop.addEventListener('click', closeDrawer);
  el.drawerTabs.addEventListener('click', e => {
    const t = e.target.closest('.drawer-tab');
    if (!t) return;
    setDrawerTab(t.dataset.tab);
  });

  /* --- settings sheet --- */
  el.btnOpenSettings.addEventListener('click', openSettings);
  el.btnOpenSettingsDesktop.addEventListener('click', openSettings);
  el.settingsBackdrop.addEventListener('click', closeSettings);
  el.sheetDone.addEventListener('click', closeSettings);

  /* --- edge swipe to open drawer --- */
  let swipeTracking = false;
  let sx = 0, sy = 0, st = 0;

  document.addEventListener('touchstart', e => {
    if (!isMobile()) { swipeTracking = false; return; }
    if (e.touches.length !== 1) { swipeTracking = false; return; }
    const t = e.touches[0];
    if (t.clientX <= 16 &&
        !el.sidebar.classList.contains('open') &&
        !el.settingsSheet.classList.contains('open')) {
      swipeTracking = true;
      sx = t.clientX; sy = t.clientY; st = Date.now();
    } else {
      swipeTracking = false;
    }
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (!swipeTracking) return;
    swipeTracking = false;
    if (!isMobile()) return;

    const t = e.changedTouches[0];
    const dx = t.clientX - sx;
    const dy = t.clientY - sy;
    const dt = Date.now() - st;

    if (dx >= 80 && dt <= 350 && Math.abs(dy) <= 25 && dx > 0) {
      openDrawer();
    }
  }, { passive: true });

  /* --- keyboard --- */
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;

    if (e.code === 'Escape') {
      if (el.sidebar.classList.contains('open')) { closeDrawer(); return; }
      if (el.settingsSheet.classList.contains('open')) { closeSettings(); return; }
    }
    if (e.code === 'Space')           { e.preventDefault(); el.btnPlay.click(); }
    else if (e.code === 'ArrowRight')  { e.preventDefault(); el.btnNext.click(); }
    else if (e.code === 'ArrowLeft')   { e.preventDefault(); el.btnPrev.click(); }
  });

  /* --- viewport sync --- */
  const syncViewport = () => {
    el.btnCloseDrawer.style.display = isMobile() ? 'flex' : 'none';
    positionRepeatBlock();
    if (!isMobile()) closeDrawer();
  };
  syncViewport();
  window.addEventListener('resize', syncViewport);
  window.addEventListener('orientationchange', () => setTimeout(syncViewport, 120));
}

function setReciter(id) {
  state.reciter = id;
  configDirty = true;
  syncReciterUI();
  if (state.playingAya !== null && state.started) {
    const wasPlaying = !audio.paused;
    const aya = state.playingAya;
    playTrack(state.sura, aya);
    if (!wasPlaying) audio.pause();
  }
  toast('Reciter: ' + currentReciter().name);
}

/* ==================================================================
   20. TOAST
   ================================================================== */
let toastTimer = null;
function toast(msg) {
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove('show'), 3500);
}

/* ==================================================================
   21. GO
   ================================================================== */
updateOpts();
init();

})();
</script>
